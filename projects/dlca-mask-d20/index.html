      ["hit", "% circ", "damaged", "repaired", "exact", "at golden", "LUT-bit writes"],
      M.recovery.map(function (r) {
        return [r.nHit, r.pctCircuit + "%", fmt(r.damaged, 4), fmt(r.repaired, 4),
                pct(r.exact), pct(r.goldenEnd), Math.round(r.writes)];
      })));
  }

  // ---- persistence ---------------------------------------------------------
  var pc = card("Persistence with no damage at all",
    "The quiet-sky case, and the one that catches a rule with no stopping condition: " +
    "left running on an undamaged circuit, does it hold still or slowly eat what it is " +
    "protecting?");
  pc.appendChild(table(["after", "accuracy", "bits off golden", "cumulative writes"],
    M.persistence.marks.map(function (m) {
      return [m.step + " steps", fmt(m.acc, 6), m.offGolden, Math.round(m.writes)];
    })));

  // ---- deployment overhead -------------------------------------------------
  var oc = card("What fault tolerance costs at deployment", null, true);
  var op = h("p");
  op.innerHTML =
    "The baseline is the circuit as <code>soc.verilog</code> ships it: <span class='num'>" +
    O.baselineLuts + "</span> constant LUT4s and <b>no state whatsoever</b>. Everything " +
    "below exists only so the circuit can repair itself. Configuration flip-flops are the " +
    "price of a writable LUT and any runtime scheme pays them; the message state and the " +
    "rule are what this approach costs on top of a plain scrubber.";
  oc.insertBefore(op, oc.children[1] || null);

  oc.appendChild(table(["", "cost", "note"], [
    ["configuration storage", O.cfgFlops + " flip-flops",
     "16 per gate — a writable LUT cannot be a fabric constant"],
    ["message state", O.memFlops + " flip-flops",
     A.nodes + " nodes x " + c.mem + " bits, double-buffered"],
    ["update rule", O.ruleLuts + " LUT4", A.ruleKB + " KB of LUT contents, no weight RAM"],
    ["multipliers / block RAM", "0 / 0", "the whole argument for a Boolean rule"],
    ["logic vs bare circuit", O.logicRatio + "x", "rule + substrate against " + O.baselineLuts + " LUT4"]
  ]));

  var bp = h("p");
  bp.innerHTML =
    "<b>Bandwidth.</b> The engine sweeps one node per cycle and moves that node's feature " +
    "bus in and its message word out, so a step costs <span class='num'>" +
    human(O.msgBitsPerStep) + "</span> bits (" + A.nodes + " nodes x " +
    (O.featureBits + c.mem) + " bits) whether or not anything is wrong. At " + O.mhz +
    " MHz that is <span class='num'>" + human(O.stepsPerSecond) + "</span> steps/s and " +
    "<span class='num'>" + human(O.msgBitsPerSecond) + "</span> bits/s of standing traffic — " +
    "the cost of being ready. Configuration writes sit on top and are the only part that " +
    "scales with damage.";
  oc.appendChild(bp);
  oc.appendChild(table(["fault size", "config-bit writes", "message bits moved", "total"],
    O.perEvent.map(function (r) {
      return [r.nHit + " gates", Math.round(r.cfgWrites), human(r.msgBits), human(r.totalBits)];
    })));

  var qp = h("p");
  qp.innerHTML = "Over " + M.persistence.horizon + " undamaged steps the rule wrote " +
    "<span class='num'>" + Math.round(O.quiescentWrites) + "</span> configuration bits" +
    (O.quiescentWrites === 0
      ? " — <b>exactly zero</b>, so on a quiet sky the only cost is the message traffic above."
      : ", which is drift and should be zero.");
  oc.appendChild(qp);
})();
</script>
